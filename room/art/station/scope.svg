<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- What the digital microscope shows: a magnified corner of a circuit board (a QFN, passives, traces, vias),
       lit by the ring light, with the camera's on-screen display. Emissive art for the 10-inch monitor. -->
  <defs>
    <radialGradient id="lit" cx="0.46" cy="0.48" r="0.75">
      <stop offset="0" stop-color="#2f9a63"/>
      <stop offset="0.55" stop-color="#1f7a4c"/>
      <stop offset="1" stop-color="#0d3f27"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#e2b64e"/>
      <stop offset="1" stop-color="#a87a22"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c8ccd2"/>
      <stop offset="1" stop-color="#7d838c"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3d42"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <radialGradient id="glare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#lit)"/>
  <g filter="url(#soft)">
    <!-- Traces under the solder mask: lighter green. -->
    <g fill="none" stroke="#49b87c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 70 H150 L205 125 V168"/>
      <path d="M-10 108 H128 L170 150 V168"/>
      <path d="M240 168 V92 L300 32 H520 L560 72 H810"/>
      <path d="M275 168 V120 L330 65 H500 L545 110 H810"/>
      <path d="M452 215 H560 L610 165 H810"/>
      <path d="M452 250 H585 L625 210 H810"/>
      <path d="M452 285 H640"/>
      <path d="M452 320 H560 L600 360 V510"/>
      <path d="M170 372 V430 L120 480 V510"/>
      <path d="M205 372 V445 L170 480 V510"/>
      <path d="M240 372 V510"/>
      <path d="M310 372 V420 L370 480 H470 V510"/>
      <path d="M130 215 H60 L20 255 H-10"/>
      <path d="M130 250 H80 L45 285 H-10"/>
      <path d="M130 320 H70 V400 L20 450 H-10"/>
    </g>
    <g fill="none" stroke="#49b87c" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M660 300 V420 H810"/>
      <path d="M700 285 H810"/>
    </g>
    <!-- Vias. -->
    <g fill="url(#gold)" stroke="#0c3a25" stroke-width="2">
      <circle cx="60" cy="150" r="13"/><circle cx="330" cy="140" r="13"/><circle cx="505" cy="160" r="13"/>
      <circle cx="560" cy="430" r="13"/><circle cx="70" cy="330" r="13"/><circle cx="400" cy="440" r="13"/>
      <circle cx="745" cy="130" r="13"/>
    </g>
    <g fill="#0a2c1c">
      <circle cx="60" cy="150" r="5.5"/><circle cx="330" cy="140" r="5.5"/><circle cx="505" cy="160" r="5.5"/>
      <circle cx="560" cy="430" r="5.5"/><circle cx="70" cy="330" r="5.5"/><circle cx="400" cy="440" r="5.5"/>
      <circle cx="745" cy="130" r="5.5"/>
    </g>
    <!-- The QFN: pads on four sides, the body on top. -->
    <g fill="url(#tin)">
      <rect x="160" y="160" width="20" height="34" rx="3"/><rect x="195" y="160" width="20" height="34" rx="3"/>
      <rect x="230" y="160" width="20" height="34" rx="3"/><rect x="265" y="160" width="20" height="34" rx="3"/>
      <rect x="300" y="160" width="20" height="34" rx="3"/><rect x="335" y="160" width="20" height="34" rx="3"/>
      <rect x="370" y="160" width="20" height="34" rx="3"/><rect x="405" y="160" width="20" height="34" rx="3"/>
      <rect x="160" y="346" width="20" height="34" rx="3"/><rect x="195" y="346" width="20" height="34" rx="3"/>
      <rect x="230" y="346" width="20" height="34" rx="3"/><rect x="265" y="346" width="20" height="34" rx="3"/>
      <rect x="300" y="346" width="20" height="34" rx="3"/><rect x="335" y="346" width="20" height="34" rx="3"/>
      <rect x="370" y="346" width="20" height="34" rx="3"/><rect x="405" y="346" width="20" height="34" rx="3"/>
      <rect x="122" y="205" width="34" height="20" rx="3"/><rect x="122" y="240" width="34" height="20" rx="3"/>
      <rect x="122" y="275" width="34" height="20" rx="3"/><rect x="122" y="310" width="34" height="20" rx="3"/>
      <rect x="429" y="205" width="34" height="20" rx="3"/><rect x="429" y="240" width="34" height="20" rx="3"/>
      <rect x="429" y="275" width="34" height="20" rx="3"/><rect x="429" y="310" width="34" height="20" rx="3"/>
    </g>
    <rect x="146" y="184" width="293" height="172" rx="7" fill="url(#chip)" stroke="#000" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="170" cy="332" r="8" fill="#0d0e10"/>
    <g font-family="Helvetica Neue, Arial" fill="#a9adb3" font-weight="500">
      <text x="292" y="258" text-anchor="middle" font-size="40" letter-spacing="2">PB3204</text>
      <text x="292" y="300" text-anchor="middle" font-size="26" letter-spacing="3">QN 2531 A7</text>
    </g>
    <!-- Passives: two capacitors and a resistor on tinned pads. -->
    <g>
      <rect x="610" y="250" width="34" height="62" rx="4" fill="url(#tin)"/><rect x="716" y="250" width="34" height="62" rx="4" fill="url(#tin)"/>
      <rect x="636" y="254" width="88" height="54" rx="3" fill="#b8926a"/>
      <rect x="636" y="254" width="88" height="14" rx="3" fill="#d6b48c"/>
      <rect x="620" y="380" width="30" height="56" rx="4" fill="url(#tin)"/><rect x="712" y="380" width="30" height="56" rx="4" fill="url(#tin)"/>
      <rect x="642" y="384" width="78" height="48" rx="3" fill="#1b1c1f"/>
      <text x="681" y="419" text-anchor="middle" font-family="Helvetica Neue, Arial" font-size="27" fill="#d9dadc">103</text>
      <rect x="592" y="26" width="28" height="48" rx="4" fill="url(#tin)"/><rect x="672" y="26" width="28" height="48" rx="4" fill="url(#tin)"/>
      <rect x="612" y="30" width="68" height="40" rx="3" fill="#b8926a"/>
    </g>
    <!-- Silkscreen. -->
    <g font-family="Helvetica Neue, Arial" font-size="30" fill="#eef3ee" font-weight="500">
      <text x="150" y="142">U3</text>
      <text x="640" y="232">C12</text>
      <text x="640" y="470">R7</text>
      <text x="705" y="64">C9</text>
    </g>
    <path d="M118 150 H138 M128 140 V160" stroke="#eef3ee" stroke-width="4"/>
  </g>
  <ellipse cx="330" cy="215" rx="330" ry="210" fill="url(#glare)" opacity="0.5"/>
  <!-- The camera's overlay: a cross-hair, a scale bar and a status line. -->
  <g stroke="#ffe14a" stroke-width="1.6" fill="none" opacity="0.9">
    <path d="M400 215 V285 M365 250 H435"/>
    <circle cx="400" cy="250" r="22"/>
    <path d="M610 468 H730 M610 460 V476 M730 460 V476"/>
  </g>
  <g font-family="Menlo, monospace" font-size="19" fill="#ffe14a">
    <text x="670" y="452" text-anchor="middle">500 µm</text>
    <text x="18" y="484">48x  1080P60  AE</text>
  </g>
  <rect x="18" y="16" width="14" height="14" rx="7" fill="#ff4a3a"/>
  <text x="40" y="29" font-family="Menlo, monospace" font-size="19" fill="#ffffff">LIVE</text>
</svg>
