      <circle cx="14" cy="49" r="0.55"/><circle cx="18" cy="49" r="0.55"/><circle cx="22" cy="49" r="0.55"/><circle cx="26" cy="49" r="0.55"/><circle cx="30" cy="49" r="0.55"/><circle cx="34" cy="49" r="0.55"/><circle cx="38" cy="49" r="0.55"/><circle cx="42" cy="49" r="0.55"/>
    </g>
