    <rect width="100" height="150" fill="#fbfbf8"/>
    <rect x="2" y="2" width="96" height="146" fill="none" stroke="#111" stroke-width="0.7"/>
    <rect x="2" y="2" width="96" height="17" fill="#111"/>
    <text x="6" y="14.5" font-family="Helvetica Neue, Arial" font-weight="700" font-size="11" fill="#fff">EXPRESS</text>
    <text x="94" y="14" text-anchor="end" font-family="Menlo, monospace" font-size="7" fill="#fff">1 / 2</text>
    <text x="6" y="27" font-family="Helvetica Neue, Arial" font-weight="700" font-size="4.6" fill="#111">SHIP TO 收件</text>
    <text x="6" y="36" font-family="PingFang SC, Helvetica" font-weight="600" font-size="7" fill="#111">硬件实验室 · 2 号工作台</text>
    <text x="6" y="44" font-family="Helvetica Neue, Arial" font-size="5" fill="#111">Hardware Studio, Bench 2</text>
    <text x="6" y="51" font-family="Helvetica Neue, Arial" font-size="5" fill="#111">Building C, Floor 4 · Shenzhen</text>
