<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- One sheet for all the station's print (room/decor/station.ts cuts it up by these rectangles, in texels):
       rework front 0,0 456x312 | extractor front 460,0 400x480 | tool labels 868,4 150x56 (8, every 60 down)
       shipping label 0,320 300x450 | pcb 310,490 480x330 | ipa label 0,780 240x160 | fragile 800,490 200x100
       this-side-up 800,600 200x200 | power strip 310,830 600x100 | reel label 0,946 240x74 -->
  <defs>
    <pattern id="bars" width="23" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" width="2" height="10"/><rect x="3" width="1" height="10"/><rect x="6" width="3" height="10"/>
      <rect x="10" width="1" height="10"/><rect x="12" width="2" height="10"/><rect x="16" width="1" height="10"/>
      <rect x="18" width="3" height="10"/>
    </pattern>
    <pattern id="grille" width="200" height="11" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="200" height="6" rx="3" fill="#050506"/>
      <rect x="0" y="8" width="200" height="1" fill="#3a3c40"/>
    </pattern>
    <pattern id="qr" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4"/><rect x="4" y="4" width="2" height="4"/><rect x="6" y="0" width="2" height="2"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- Rework station front, 190 x 130 mm. -->
  <svg x="0" y="0" width="456" height="312" viewBox="0 0 190 130">
    <rect width="190" height="130" fill="#d6d8d9"/>
    <rect x="5" y="5" width="180" height="120" rx="5" fill="#e4e5e5" stroke="#b9bcbe" stroke-width="0.6"/>
    <rect x="50" y="12" width="90" height="38" rx="3" fill="#1b1d20"/>
    <rect x="54" y="16" width="82" height="30" rx="1.5" fill="#06080c"/>
    <text x="12" y="22" font-family="Helvetica Neue, Arial" font-weight="700" font-size="9" fill="#1f5fae">RW-860D</text>
    <text x="12" y="30" font-family="Helvetica Neue, Arial" font-size="4.2" fill="#4a4d52">HOT AIR REWORK</text>
    <text x="12" y="36" font-family="PingFang SC, Helvetica" font-size="4.6" fill="#4a4d52">热风拆焊台</text>
    <text x="178" y="20" text-anchor="end" font-family="Helvetica Neue, Arial" font-size="4.2" fill="#4a4d52">100–480 °C</text>
    <text x="178" y="27" text-anchor="end" font-family="Helvetica Neue, Arial" font-size="4.2" fill="#4a4d52">120 L/min</text>
    <g fill="none" stroke="#3b3e43" stroke-width="0.9" stroke-linecap="round">
      <path d="M26.4 98.6 A20 20 0 1 1 63.6 98.6"/>
      <path d="M126.4 98.6 A20 20 0 1 1 163.6 98.6"/>
    </g>
    <g fill="#3b3e43">
      <circle cx="25" cy="88" r="1"/><circle cx="29" cy="74" r="1"/><circle cx="45" cy="66.5" r="1"/><circle cx="61" cy="74" r="1"/><circle cx="65" cy="88" r="1"/>
      <circle cx="125" cy="88" r="1"/><circle cx="129" cy="74" r="1"/><circle cx="145" cy="66.5" r="1"/><circle cx="161" cy="74" r="1"/><circle cx="165" cy="88" r="1"/>
    </g>
    <g font-family="Helvetica Neue, Arial" font-size="5.2" font-weight="700" fill="#2b2e33" text-anchor="middle">
      <text x="45" y="118">TEMP</text><text x="145" y="118">AIR</text>
      <text x="95" y="62" font-size="4.2" font-weight="400">SET</text>
    </g>
    <g font-family="Helvetica Neue, Arial" font-size="3.6" fill="#55585d" text-anchor="middle">
      <text x="20" y="102">MIN</text><text x="70" y="102">MAX</text><text x="120" y="102">MIN</text><text x="170" y="102">MAX</text>
    </g>
    <rect x="83" y="66" width="24" height="15" rx="2.5" fill="#c9cbcd" stroke="#9c9fa3" stroke-width="0.5"/>
    <rect x="83" y="86" width="24" height="15" rx="2.5" fill="#c9cbcd" stroke="#9c9fa3" stroke-width="0.5"/>
    <path d="M95 69.5 L100 77.5 H90 Z M95 97.5 L100 89.5 H90 Z" fill="#3b3e43"/>
    <text x="95" y="112" text-anchor="middle" font-family="Helvetica Neue, Arial" font-size="3.6" fill="#55585d">ESD SAFE</text>
  </svg>

  <!-- Fume extractor front, 200 x 240 mm. -->
  <svg x="460" y="0" width="400" height="480" viewBox="0 0 200 240">
    <rect width="200" height="240" fill="#ecedeb"/>
    <rect x="14" y="16" width="172" height="150" rx="10" fill="#17181a"/>
    <rect x="24" y="26" width="152" height="130" rx="5" fill="#232528"/>
    <rect x="28" y="30" width="144" height="121" fill="url(#grille)"/>
    <text x="16" y="190" font-family="Helvetica Neue, Arial" font-weight="700" font-size="15" fill="#22262b">FX-150</text>
    <text x="16" y="203" font-family="Helvetica Neue, Arial" font-size="7" fill="#5a5e63">FUME EXTRACTOR · HEPA + CARBON</text>
    <text x="16" y="214" font-family="PingFang SC, Helvetica" font-size="7.5" fill="#5a5e63">焊烟净化器</text>
    <g fill="none" stroke="#3b3e43" stroke-width="1.2" stroke-linecap="round"><path d="M141 214 A19 19 0 1 1 177 214"/></g>
    <text x="159" y="231" text-anchor="middle" font-family="Helvetica Neue, Arial" font-weight="700" font-size="7" fill="#2b2e33">FLOW</text>
    <rect x="16" y="222" width="34" height="9" rx="2" fill="#dfe7df" stroke="#9aa39a" stroke-width="0.5"/>
    <text x="33" y="229" text-anchor="middle" font-family="Helvetica Neue, Arial" font-size="5.5" fill="#2d6a3e">FILTER OK</text>
  </svg>

  <!-- Tool labels, 30 x 11 mm each. -->
  <g font-family="PingFang SC, Helvetica" font-size="27" font-weight="600" fill="#1b1b1b" text-anchor="middle">
    <g transform="translate(868,4)"><rect width="150" height="56" fill="#fdfdfb" stroke="#b9b9b6" stroke-width="2"/><text x="75" y="38">斜口钳</text></g>
    <g transform="translate(868,64)"><rect width="150" height="56" fill="#fdfdfb" stroke="#b9b9b6" stroke-width="2"/><text x="75" y="38">尖嘴钳</text></g>
    <g transform="translate(868,124)"><rect width="150" height="56" fill="#fdfdfb" stroke="#b9b9b6" stroke-width="2"/><text x="75" y="38">剥线钳</text></g>
    <g transform="translate(868,184)"><rect width="150" height="56" fill="#fdfdfb" stroke="#b9b9b6" stroke-width="2"/><text x="75" y="38">螺丝刀</text></g>
    <g transform="translate(868,244)"><rect width="150" height="56" fill="#fdfdfb" stroke="#b9b9b6" stroke-width="2"/><text x="75" y="38">镊子</text></g>
    <g transform="translate(868,304)"><rect width="150" height="56" fill="#fff3a8" stroke="#b9b08a" stroke-width="2"/><text x="75" y="38">0603 电阻</text></g>
    <g transform="translate(868,364)"><rect width="150" height="56" fill="#fff3a8" stroke="#b9b08a" stroke-width="2"/><text x="75" y="38">M2 螺丝</text></g>
    <g transform="translate(868,424)"><rect width="150" height="56" fill="#fff3a8" stroke="#b9b08a" stroke-width="2"/><text x="75" y="38">排针 2.54</text></g>
  </g>

