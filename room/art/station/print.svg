  <!-- Solvent bottle label, 60 x 40 mm. -->
  <svg x="0" y="780" width="240" height="160" viewBox="0 0 60 40">
    <rect width="60" height="40" fill="#fbfbf6"/>
    <rect width="60" height="9" fill="#f2c200"/>
