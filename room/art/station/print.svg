      <rect x="76" y="31.5" width="2.6" height="8.5" rx="0.6" fill="#15161a" transform="rotate(-30 77.3 35.7)"/>
      <rect x="97.4" y="31.5" width="2.6" height="8.5" rx="0.6" fill="#15161a" transform="rotate(30 98.7 35.7)"/>
