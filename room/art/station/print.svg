  <!-- Power strip top, 300 x 50 mm: four 5-hole sockets and the switch end. -->
  <svg x="310" y="830" width="600" height="100" viewBox="0 0 300 50">
    <rect width="300" height="50" fill="#f1f1ee"/>
    <g id="socket">
      <rect x="62" y="5" width="52" height="40" rx="5" fill="#e6e6e2" stroke="#c4c4bf" stroke-width="0.6"/>
      <rect x="77" y="11" width="2.6" height="8" rx="0.6" fill="#15161a"/><rect x="96.4" y="11" width="2.6" height="8" rx="0.6" fill="#15161a"/>
