      <rect x="8" y="12.8" width="2.4" height="2.4" rx="0.4"/><rect x="8" y="15.8" width="2.4" height="2.4" rx="0.4"/><rect x="8" y="18.8" width="2.4" height="2.4" rx="0.4"/><rect x="8" y="21.8" width="2.4" height="2.4" rx="0.4"/>
      <circle cx="14" cy="49" r="1.3"/><circle cx="18" cy="49" r="1.3"/><circle cx="22" cy="49" r="1.3"/><circle cx="26" cy="49" r="1.3"/><circle cx="30" cy="49" r="1.3"/><circle cx="34" cy="49" r="1.3"/><circle cx="38" cy="49" r="1.3"/><circle cx="42" cy="49" r="1.3"/>
      <circle cx="24" cy="33" r="0.8"/><circle cx="52" cy="12" r="0.8"/><circle cx="64" cy="26" r="0.8"/><circle cx="30" cy="10" r="0.8"/>
    </g>
    <g fill="#0b2b1c">
