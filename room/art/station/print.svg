      <rect x="46.4" y="13.5" width="1.6" height="0.9"/><rect x="46.4" y="16" width="1.6" height="0.9"/><rect x="46.4" y="18.5" width="1.6" height="0.9"/><rect x="46.4" y="21" width="1.6" height="0.9"/><rect x="46.4" y="23.5" width="1.6" height="0.9"/><rect x="46.4" y="26" width="1.6" height="0.9"/>
