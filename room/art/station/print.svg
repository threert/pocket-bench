    <text x="6" y="80" font-family="Helvetica Neue, Arial" font-weight="700" font-size="24" fill="#111">SZ-07</text>
    <rect x="65" y="60" width="28" height="28" fill="url(#qr)"/>
    <rect x="65" y="60" width="8" height="8" fill="#111"/><rect x="85" y="60" width="8" height="8" fill="#111"/><rect x="65" y="80" width="8" height="8" fill="#111"/>
    <rect x="67" y="62" width="4" height="4" fill="#fbfbf8"/><rect x="87" y="62" width="4" height="4" fill="#fbfbf8"/><rect x="67" y="82" width="4" height="4" fill="#fbfbf8"/>
    <rect x="8" y="98" width="84" height="26" fill="url(#bars)"/>
    <text x="50" y="131" text-anchor="middle" font-family="Menlo, monospace" font-size="5.4" fill="#111">PB 7731 0420 8816 53</text>
    <text x="6" y="142" font-family="Helvetica Neue, Arial" font-size="4.6" fill="#111">12.4 kg · 50 × 36 × 40 cm</text>
    <text x="94" y="142" text-anchor="end" font-family="PingFang SC, Helvetica" font-size="4.6" fill="#111">电子元件</text>
  </svg>

