  <rect x="0" y="512" width="256" height="40" fill="#1f8a4c"/>
  <text x="128" y="542" font-size="30" font-weight="700" fill="#fff" letter-spacing="3">CALIBRATED</text>
  <g font-size="22" font-family="Menlo, monospace" fill="#26282c" text-anchor="start">
    <text x="14" y="582">ID   LAB-0417</text><text x="14" y="610">DUE  03 / 2027</text><text x="14" y="634" font-size="16" fill="#5c6066">BY   QA-2</text>
  </g>
