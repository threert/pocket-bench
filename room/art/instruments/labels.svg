  <g fill="#26282c"><rect x="282" y="566" width="4" height="36"/><rect x="290" y="566" width="2" height="36"/><rect x="296" y="566" width="6" height="36"/><rect x="306" y="566" width="2" height="36"/><rect x="312" y="566" width="4" height="36"/><rect x="320" y="566" width="2" height="36"/><rect x="326" y="566" width="2" height="36"/><rect x="332" y="566" width="6" height="36"/><rect x="342" y="566" width="4" height="36"/><rect x="350" y="566" width="2" height="36"/><rect x="356" y="566" width="6" height="36"/><rect x="366" y="566" width="2" height="36"/><rect x="372" y="566" width="4" height="36"/><rect x="380" y="566" width="6" height="36"/><rect x="390" y="566" width="2" height="36"/><rect x="396" y="566" width="4" height="36"/><rect x="404" y="566" width="2" height="36"/><rect x="410" y="566" width="6" height="36"/><rect x="420" y="566" width="2" height="36"/><rect x="426" y="566" width="4" height="36"/><rect x="434" y="566" width="2" height="36"/><rect x="440" y="566" width="6" height="36"/><rect x="450" y="566" width="4" height="36"/><rect x="458" y="566" width="2" height="36"/><rect x="464" y="566" width="6" height="36"/><rect x="474" y="566" width="2" height="36"/><rect x="480" y="566" width="4" height="36"/></g>
