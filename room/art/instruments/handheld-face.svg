<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="1129" viewBox="0 0 780 1720" font-family="Helvetica Neue, Helvetica, Arial" text-anchor="middle">
  <!-- The handheld multimeter's face, 78 x 172 mm; one unit is 0.1 mm. Its LCD is off-white with dark segments. -->
  <defs>
    <polygon id="h" points="7,0 43,0 48,5 43,10 7,10 2,5"/>
    <polygon id="v" points="0,7 5,2 10,7 10,43 5,48 0,43"/>
    <use id="A" xlink:href="#h" x="5"/><use id="G" xlink:href="#h" x="5" y="45"/><use id="D" xlink:href="#h" x="5" y="90"/>
    <use id="F" xlink:href="#v" y="5"/><use id="B" xlink:href="#v" x="50" y="5"/><use id="E" xlink:href="#v" y="50"/><use id="C" xlink:href="#v" x="50" y="50"/>
    <g id="n0"><use xlink:href="#A"/><use xlink:href="#B"/><use xlink:href="#C"/><use xlink:href="#D"/><use xlink:href="#E"/><use xlink:href="#F"/></g>
    <rect id="k" x="-68" y="-38" width="136" height="76" rx="14"/>
  </defs>
  <rect width="780" height="1720" fill="#26282c"/>
  <g text-anchor="start"><text x="84" y="88" font-size="40" font-weight="700" fill="#f0f1f2" letter-spacing="1">HM-117</text></g>
  <text x="696" y="86" font-size="20" font-weight="700" fill="#e8b923" text-anchor="end" letter-spacing="1.5">TRUE RMS</text>
  <!-- the LCD -->
  <rect x="70" y="112" width="640" height="340" rx="22" fill="#0e0f10"/>
  <rect x="92" y="132" width="596" height="300" rx="10" fill="#a3ad9c"/>
  <g transform="translate(132,206) skewX(-6) scale(1.6)" fill="#1e231d">
    <use xlink:href="#n0"/><circle cx="70" cy="95" r="6"/><use xlink:href="#n0" x="82"/><use xlink:href="#n0" x="164"/><use xlink:href="#n0" x="246"/>
  </g>
  <g font-size="26" font-weight="700" fill="#1e231d" text-anchor="start"><text x="112" y="172">AUTO</text><text x="212" y="172">DC</text></g>
  <text x="672" y="372" font-size="60" font-weight="700" fill="#1e231d" text-anchor="end">V</text>
  <!-- keys -->
  <use xlink:href="#k" x="135" y="540" fill="#e8b923"/>
  <g fill="#6c7078"><use xlink:href="#k" x="305" y="540"/><use xlink:href="#k" x="475" y="540"/><use xlink:href="#k" x="645" y="540"/></g>
  <g font-size="24" font-weight="700"><text x="135" y="549" fill="#1d1f23">HOLD</text><g fill="#f1f2f3"><text x="305" y="549">RANGE</text><text x="475" y="549">REL</text><text x="645" y="549">Hz %</text></g></g>
  <!-- the function ring around the selector -->
  <circle cx="390" cy="980" r="228" fill="#1b1d20"/>
  <g font-size="30" font-weight="700" fill="#f0f1f2">
    <text x="130" y="1140" fill="#ff5a4d" font-size="26">OFF</text>
    <text x="100" y="991">V~</text>
    <text x="134" y="846">V⎓</text>
    <text x="242" y="738">mV</text>
    <text x="390" y="702">Ω</text>
    <text x="538" y="738" font-size="24">CAP</text>
    <text x="646" y="846">Hz</text>
    <text x="680" y="991" fill="#e8b923">mA</text>
    <text x="650" y="1140" fill="#e8b923">A</text>
  </g>
  <!-- jacks -->
  <g font-size="24" font-weight="700" fill="#f0f1f2">
    <text x="120" y="1424">10A</text><text x="300" y="1424">mA</text><text x="480" y="1424">COM</text><text x="660" y="1424">VΩ</text>
  </g>
  <g fill="none" stroke-width="7">
    <circle cx="120" cy="1520" r="72" stroke="#c9382e"/><circle cx="300" cy="1520" r="72" stroke="#c9382e"/><circle cx="480" cy="1520" r="72" stroke="#7b8088"/><circle cx="660" cy="1520" r="72" stroke="#c9382e"/>
  </g>
  <path d="M210,1456V1600M570,1456V1600" stroke="#55585e" stroke-width="3"/>
  <text x="390" y="1668" font-size="21" font-weight="500" fill="#a9aeb5" letter-spacing="1.5">CAT III 600 V   ⚠ 10 A FUSED</text>
</svg>
