<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2048" height="937" viewBox="0 0 3060 1400" font-family="Helvetica Neue, Helvetica, Arial" text-anchor="middle">
  <!-- The oscilloscope's front, 306 x 140 mm; one unit is 0.1 mm. Key tops sample this picture where they sit. -->
  <defs>
    <rect id="soft" x="-58" y="-38" width="116" height="76" rx="12"/>
    <rect id="fn" x="-63" y="-40.5" width="126" height="81" rx="12"/>
    <rect id="run" x="-78" y="-43" width="156" height="86" rx="12"/>
    <rect id="ch" x="-58" y="-43" width="116" height="86" rx="12"/>
    <rect id="sm" x="-63" y="-38" width="126" height="76" rx="12"/>
    <rect id="tr" x="-68" y="-40.5" width="136" height="81" rx="12"/>
  </defs>
  <rect width="3060" height="1400" fill="#d5d4cf"/>
  <!-- behind the screen's glass -->
  <rect x="60" y="60" width="1640" height="1020" rx="36" fill="#0c0d0f"/>
  <!-- soft keys beside the screen -->
  <g fill="#b9bbc0">
    <use xlink:href="#soft" x="1775" y="175"/>
    <use xlink:href="#soft" x="1775" y="300"/><use xlink:href="#soft" x="1775" y="416"/><use xlink:href="#soft" x="1775" y="531"/>
    <use xlink:href="#soft" x="1775" y="647"/><use xlink:href="#soft" x="1775" y="763"/><use xlink:href="#soft" x="1775" y="878"/>
    <use xlink:href="#soft" x="1775" y="1000"/>
  </g>
  <g font-size="17" font-weight="500" fill="#24262a">
    <text x="1775" y="181">MENU</text><text x="1775" y="1006">BACK</text>
  </g>
  <g stroke="#6d7076" stroke-width="5" stroke-linecap="round">
    <path d="M1755,300H1795M1755,416H1795M1755,531H1795M1755,647H1795M1755,763H1795M1755,878H1795"/>
  </g>

  <!-- the control field -->
  <rect x="1870" y="40" width="1160" height="1050" rx="42" fill="#373b41"/>
  <g fill="none" stroke="#7b8088" stroke-width="3">
    <rect x="1900" y="380" width="560" height="680" rx="22"/>
    <rect x="2480" y="380" width="260" height="680" rx="22"/>
    <rect x="2760" y="380" width="240" height="680" rx="22"/>
  </g>
  <g font-size="20" font-weight="700" fill="#e6e7e9" letter-spacing="2">
    <text x="2180" y="428">VERTICAL</text><text x="2610" y="428">HORIZONTAL</text><text x="2880" y="428">TRIGGER</text>
  </g>
  <g font-size="16" font-weight="500" fill="#c9ccd1" letter-spacing="1">
    <text x="2020" y="322">ADJUST</text>
    <text x="2290" y="480">POSITION</text><text x="2290" y="688">SCALE</text>
    <text x="2610" y="480">POSITION</text><text x="2610" y="692">SCALE</text>
    <text x="2880" y="480">LEVEL</text>
  </g>
  <!-- arcs around the two scale knobs -->
  <g fill="none" stroke="#c9ccd1" stroke-width="3" stroke-linecap="round">
    <path d="M2206,862A106,106 0 1 1 2374,862"/>
    <path d="M2530,928A100,100 0 1 1 2690,928"/>
  </g>
  <!-- function keys -->
  <g fill="#c6c8cc">
    <use xlink:href="#fn" x="2220" y="140"/><use xlink:href="#fn" x="2360" y="140"/><use xlink:href="#fn" x="2500" y="140"/>
    <use xlink:href="#fn" x="2220" y="260"/><use xlink:href="#fn" x="2360" y="260"/><use xlink:href="#fn" x="2500" y="260"/>
    <use xlink:href="#run" x="2890" y="260"/><use xlink:href="#run" x="2710" y="260"/><use xlink:href="#run" x="2710" y="140"/>
    <use xlink:href="#sm" x="2000" y="995"/><use xlink:href="#sm" x="2145" y="995"/><use xlink:href="#sm" x="2290" y="995"/>
    <use xlink:href="#sm" x="2610" y="995"/>
    <use xlink:href="#tr" x="2880" y="710"/><use xlink:href="#tr" x="2880" y="850"/><use xlink:href="#tr" x="2880" y="995"/>
  </g>
  <use xlink:href="#run" x="2890" y="140" fill="#3fd06b"/>
  <g font-size="19" font-weight="500" fill="#1d1f23">
    <text x="2220" y="147">Measure</text><text x="2360" y="147">Acquire</text><text x="2500" y="147">Storage</text>
    <text x="2220" y="267">Cursor</text><text x="2360" y="267">Display</text><text x="2500" y="267">Utility</text>
    <text x="2710" y="147" font-weight="700">AUTO</text><text x="2890" y="147" font-weight="700">RUN/STOP</text>
    <text x="2710" y="267" font-weight="700">CLEAR</text><text x="2890" y="267" font-weight="700" fill="#b24a00">SINGLE</text>
    <text x="2000" y="1002">Math</text><text x="2145" y="1002">Ref</text><text x="2290" y="1002">Decode</text>
    <text x="2610" y="1002">Menu</text>
    <text x="2880" y="717">Mode</text><text x="2880" y="857">Menu</text><text x="2880" y="1002">Force</text>
  </g>
  <!-- channel keys -->
  <use xlink:href="#ch" x="2000" y="530" fill="#f0c61c"/><use xlink:href="#ch" x="2000" y="650" fill="#27c3e2"/>
  <use xlink:href="#ch" x="2000" y="770" fill="#da55b6"/><use xlink:href="#ch" x="2000" y="890" fill="#4a79e6"/>
  <g font-size="36" font-weight="700" fill="#15161a">
    <text x="2000" y="543">1</text><text x="2000" y="663">2</text><text x="2000" y="783">3</text><text x="2000" y="903">4</text>
  </g>

  <!-- the bottom strip -->
  <circle cx="130" cy="1245" r="60" fill="#c6c8cc"/>
  <g fill="none" stroke="#2a2c30" stroke-width="6" stroke-linecap="round"><path d="M112,1228A27,27 0 1 0 148,1228M130,1214V1244"/></g>
  <rect x="266" y="1206" width="148" height="78" rx="8" fill="#2c2e32"/>
  <text x="340" y="1326" font-size="17" font-weight="500" fill="#55585e" letter-spacing="1">USB</text>
  <g text-anchor="start" fill="#26282c">
    <text x="480" y="1250" font-size="56" font-weight="700" letter-spacing="1">DS-1104</text>
    <text x="482" y="1304" font-size="21" fill="#55585e" letter-spacing="1.5">DIGITAL OSCILLOSCOPE   100 MHz   1 GSa/s</text>
  </g>
  <g fill="none" stroke-width="15">
    <circle cx="1830" cy="1245" r="104" stroke="#e3b70e"/><circle cx="2150" cy="1245" r="104" stroke="#18b1d0"/>
    <circle cx="2470" cy="1245" r="104" stroke="#cf45aa"/><circle cx="2790" cy="1245" r="104" stroke="#3b6ad8"/>
  </g>
  <g font-size="27" font-weight="700" text-anchor="start">
    <text x="1688" y="1144" fill="#b08c00">CH1</text><text x="2008" y="1144" fill="#0d8ba6">CH2</text>
    <text x="2328" y="1144" fill="#a92f88">CH3</text><text x="2648" y="1144" fill="#2b55b8">CH4</text>
  </g>
  <g font-size="15" fill="#55585e">
    <text x="1830" y="1381">1 MΩ  300 V RMS</text><text x="2150" y="1381">1 MΩ  300 V RMS</text><text x="2470" y="1381">1 MΩ  300 V RMS</text><text x="2790" y="1381">1 MΩ  300 V RMS</text>
  </g>
  <g fill="none" stroke="#55585e" stroke-width="3"><path d="M2954,1262v-18h14v18h14v-18h14v18"/></g>
  <text x="2976" y="1381" font-size="15" fill="#55585e">3 V  1 kHz</text>
</svg>
