<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#fbfaf6"/><rect width="800" height="250" fill="#7a4fd0"/><text x="60" y="128" font-family="Helvetica Neue, Arial" font-weight="800" font-size="76" fill="#ffffff" fill-opacity="0.55">04</text><text x="60" y="212" font-family="PingFang SC, Helvetica" font-weight="700" font-size="68" fill="#ffffff">调光台</text><text x="740" y="128" text-anchor="end" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#ffffff" fill-opacity="0.85">15 分钟 · ★★☆</text><text x="60" y="320" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">八个旋钮、九颗彩灯：拧一拧，调出你自己</text><text x="60" y="370" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">的颜色。</text><rect x="60" y="404" width="137" height="54" rx="27" fill="#7a4fd0" fill-opacity="0.13" stroke="#7a4fd0" stroke-opacity="0.5" stroke-width="2"/><text x="128.5" y="442" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#7a4fd0">八旋钮</text><line x1="60" y1="490" x2="740" y2="490" stroke="#d9d6cc" stroke-width="2"/><rect x="60" y="516" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="546" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把『八旋钮』模块接到 Tab5 上</text><rect x="60" y="594" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="624" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">请 AI 做一张调光台</text><rect x="60" y="672" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="702" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把第一个旋钮拧到头，另外两个拧到底</text><text x="116" y="746" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">，调出一片红</text><rect x="60" y="794" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="824" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">让 AI 接上总开关，然后拨一下模块上</text><text x="116" y="868" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">的小开关，再拨回来</text><text x="400" y="1072" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="28" fill="#9a9da3">点一下这张卡片开始</text></svg>