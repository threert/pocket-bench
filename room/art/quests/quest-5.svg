<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#fbfaf6"/><rect width="800" height="250" fill="#c9a400"/><text x="60" y="128" font-family="Helvetica Neue, Arial" font-weight="800" font-size="76" fill="#ffffff" fill-opacity="0.55">06</text><text x="60" y="212" font-family="PingFang SC, Helvetica" font-weight="700" font-size="68" fill="#ffffff">智能台灯</text><text x="740" y="128" text-anchor="end" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#ffffff" fill-opacity="0.85">15 分钟 · ★★☆</text><text x="60" y="320" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">天黑了自己亮：教台灯学会看天色。</text><rect x="60" y="354" width="137" height="54" rx="27" fill="#c9a400" fill-opacity="0.13" stroke="#c9a400" stroke-opacity="0.5" stroke-width="2"/><text x="128.5" y="392" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#c9a400">环境光</text><rect x="213" y="354" width="199" height="54" rx="27" fill="#c9a400" fill-opacity="0.13" stroke="#c9a400" stroke-opacity="0.5" stroke-width="2"/><text x="312.5" y="392" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#c9a400">四路继电器</text><line x1="60" y1="440" x2="740" y2="440" stroke="#d9d6cc" stroke-width="2"/><rect x="60" y="466" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="496" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把『环境光』和『四路继电器』两个模</text><text x="116" y="540" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">块都接上</text><rect x="60" y="588" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="618" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">请 AI 做一个能看亮度、能开关台灯的</text><text x="116" y="662" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">界面</text><rect x="60" y="710" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="740" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">点一下屏幕上的开关，亲手把台灯点亮</text><rect x="60" y="788" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="818" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">让 AI 加上自动模式，然后把房间的灯</text><text x="116" y="862" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">关掉</text><rect x="60" y="910" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="940" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">再把房间的灯打开，台灯应该自己关掉</text><text x="400" y="1072" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="28" fill="#9a9da3">点一下这张卡片开始</text></svg>