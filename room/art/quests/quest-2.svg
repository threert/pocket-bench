<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#fbfaf6"/><rect width="800" height="250" fill="#0f9d8a"/><text x="60" y="128" font-family="Helvetica Neue, Arial" font-weight="800" font-size="76" fill="#ffffff" fill-opacity="0.55">03</text><text x="60" y="212" font-family="PingFang SC, Helvetica" font-weight="700" font-size="68" fill="#ffffff">倒车雷达</text><text x="740" y="128" text-anchor="end" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#ffffff" fill-opacity="0.85">10 分钟 · ★☆☆</text><text x="60" y="320" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">用超声波量距离：越近越红，太近了就喊停</text><text x="60" y="370" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">。</text><rect x="60" y="404" width="199" height="54" rx="27" fill="#0f9d8a" fill-opacity="0.13" stroke="#0f9d8a" stroke-opacity="0.5" stroke-width="2"/><text x="159.5" y="442" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#0f9d8a">超声波测距</text><line x1="60" y1="490" x2="740" y2="490" stroke="#d9d6cc" stroke-width="2"/><rect x="60" y="516" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="546" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把『超声波』模块接到 Tab5 上</text><rect x="60" y="594" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="624" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">请 AI 做一个倒车雷达界面</text><rect x="60" y="672" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="702" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把黄色方块慢慢推近模块，停在 30 厘</text><text x="116" y="746" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">米以内</text><rect x="60" y="794" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="824" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">让 AI 加上『太近了』警告，再把方块</text><text x="116" y="868" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">推到 10 厘米以内</text><rect x="60" y="916" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="946" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把方块拉回 50 厘米以外，警告应该自</text><text x="116" y="990" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">己消失</text><text x="400" y="1072" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="28" fill="#9a9da3">点一下这张卡片开始</text></svg>