<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#fbfaf6"/><rect width="800" height="250" fill="#d08a12"/><text x="60" y="128" font-family="Helvetica Neue, Arial" font-weight="800" font-size="76" fill="#ffffff" fill-opacity="0.55">05</text><text x="60" y="212" font-family="PingFang SC, Helvetica" font-weight="700" font-size="68" fill="#ffffff">门禁打卡</text><text x="740" y="128" text-anchor="end" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#ffffff" fill-opacity="0.85">15 分钟 · ★★☆</text><text x="60" y="320" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">刷卡、亮灯、记一笔：给工作室装一套小门</text><text x="60" y="370" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">禁。</text><rect x="60" y="404" width="168" height="54" rx="27" fill="#d08a12" fill-opacity="0.13" stroke="#d08a12" stroke-opacity="0.5" stroke-width="2"/><text x="144" y="442" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#d08a12">射频读卡</text><rect x="244" y="404" width="199" height="54" rx="27" fill="#d08a12" fill-opacity="0.13" stroke="#d08a12" stroke-opacity="0.5" stroke-width="2"/><text x="343.5" y="442" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#d08a12">四路继电器</text><line x1="60" y1="490" x2="740" y2="490" stroke="#d9d6cc" stroke-width="2"/><rect x="60" y="516" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="546" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把『RFID』和『四路继电器』两个模块</text><text x="116" y="590" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">都接上</text><rect x="60" y="638" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="668" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">请 AI 做出读卡界面，再把『员工卡』</text><text x="116" y="712" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">放到读卡器上</text><rect x="60" y="760" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="790" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">让 AI 加上放行规则，然后重新刷一次</text><text x="116" y="834" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">员工卡</text><rect x="60" y="882" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="912" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">换『访客卡』刷一下，看它会不会被拦</text><text x="116" y="956" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">下</text><rect x="60" y="1004" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="1034" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">让 AI 加一份打卡记录，再把两张卡各</text><text x="116" y="1078" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">刷一次</text><text x="400" y="1072" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="28" fill="#9a9da3">点一下这张卡片开始</text></svg>