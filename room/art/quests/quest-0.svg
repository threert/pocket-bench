<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#fbfaf6"/><rect width="800" height="250" fill="#1f8f4e"/><text x="60" y="128" font-family="Helvetica Neue, Arial" font-weight="800" font-size="76" fill="#ffffff" fill-opacity="0.55">01</text><text x="60" y="212" font-family="PingFang SC, Helvetica" font-weight="700" font-size="68" fill="#ffffff">你好，Tab5</text><text x="740" y="128" text-anchor="end" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#ffffff" fill-opacity="0.85">5 分钟 · ★☆☆</text><text x="60" y="320" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">先和 Tab5 打个招呼：点点屏幕，再请 AI</text><text x="60" y="370" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b"> 帮你改出第一个 App。</text><rect x="60" y="404" width="261" height="54" rx="27" fill="#1f8f4e" fill-opacity="0.13" stroke="#1f8f4e" stroke-opacity="0.5" stroke-width="2"/><text x="190.5" y="442" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#1f8f4e">只用 Tab5</text><line x1="60" y1="490" x2="740" y2="490" stroke="#d9d6cc" stroke-width="2"/><rect x="60" y="516" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="546" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">点一下 Tab5 屏幕上的蓝色按钮</text><rect x="60" y="594" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="624" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">请 AI 把它改成一个中文的打招呼 App</text><rect x="60" y="672" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="702" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">在新的 App 里把按钮点上三下</text><rect x="60" y="750" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="780" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">再让 AI 加一个『换颜色』按钮，然后</text><text x="116" y="824" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">点它一下</text><text x="400" y="1072" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="28" fill="#9a9da3">点一下这张卡片开始</text></svg>