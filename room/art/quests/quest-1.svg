<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#fbfaf6"/><rect width="800" height="250" fill="#2f6fd6"/><text x="60" y="128" font-family="Helvetica Neue, Arial" font-weight="800" font-size="76" fill="#ffffff" fill-opacity="0.55">02</text><text x="60" y="212" font-family="PingFang SC, Helvetica" font-weight="700" font-size="68" fill="#ffffff">桌面气象站</text><text x="740" y="128" text-anchor="end" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#ffffff" fill-opacity="0.85">10 分钟 · ★☆☆</text><text x="60" y="320" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">插上温湿度气压模块，做一块会看天气脸色</text><text x="60" y="370" font-family="PingFang SC, Helvetica" font-size="35" fill="#33363b">的小屏幕。</text><rect x="60" y="404" width="199" height="54" rx="27" fill="#2f6fd6" fill-opacity="0.13" stroke="#2f6fd6" stroke-opacity="0.5" stroke-width="2"/><text x="159.5" y="442" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="30" fill="#2f6fd6">温湿度气压</text><line x1="60" y1="490" x2="740" y2="490" stroke="#d9d6cc" stroke-width="2"/><rect x="60" y="516" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="546" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">把『温湿度气压』模块接到 Tab5 上</text><rect x="60" y="594" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="624" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">请 AI 做一个气象站界面</text><rect x="60" y="672" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="702" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">打开热风枪，对着模块吹一会儿</text><rect x="60" y="750" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="780" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">让 AI 加一个高温提醒，再把模块吹到</text><text x="116" y="824" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226"> 30 °C 以上</text><rect x="60" y="872" width="34" height="34" rx="7" fill="none" stroke="#8a8d92" stroke-width="3"/><text x="116" y="902" font-family="PingFang SC, Helvetica" font-size="32" fill="#1f2226">关掉热风枪，换喷雾瓶朝模块喷两下</text><text x="400" y="1072" text-anchor="middle" font-family="PingFang SC, Helvetica" font-weight="600" font-size="28" fill="#9a9da3">点一下这张卡片开始</text></svg>